<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1d2b3a;
    font-family: system-ui, sans-serif;
    color: #cfd8e3;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }
  svg {
    width: 100%;
    max-width: 960px;
    height: auto;
    display: block;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
    cursor: pointer;
  }
  p { font-size: 14px; opacity: .7; margin: 12px 0 0; }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 800 400" role="img" aria-label="鹈鹕骑自行车动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ab4f0"/>
      <stop offset="1" stop-color="#d7f1ff"/>
    </linearGradient>

    <!-- 云朵（用 <use> 复用） -->
    <g id="cloud">
      <ellipse cx="0"   cy="0"  rx="40" ry="16" fill="#ffffff"/>
      <ellipse cx="-22" cy="-6" rx="20" ry="14" fill="#ffffff"/>
      <ellipse cx="22"  cy="-8" rx="24" ry="16" fill="#ffffff"/>
    </g>

    <!-- 滚动的路面纹理 -->
    <pattern id="dirt" width="60" height="40" patternUnits="userSpaceOnUse">
      <rect x="0"  y="18" width="28" height="3" rx="1.5" fill="#9c7244"/>
      <rect x="34" y="30" width="18" height="3" rx="1.5" fill="#9c7244"/>
    </pattern>
  </defs>

  <!-- 天空 & 太阳 -->
  <rect width="800" height="400" fill="url(#sky)"/>
  <circle cx="700" cy="60" r="34" fill="#ffd54a"/>
  <circle cx="700" cy="60" r="46" fill="#ffd54a" opacity=".25"/>

  <!-- 云：每朵画两次，便于横向循环 -->
  <g id="clouds">
    <use href="#cloud" x="40"  y="60"/>
    <use href="#cloud" x="260" y="92"/>
    <use href="#cloud" x="470" y="50"/>
    <use href="#cloud" x="640" y="84"/>
    <use href="#cloud" x="840" y="60"/>
    <use href="#cloud" x="1060" y="92"/>
    <use href="#cloud" x="1270" y="50"/>
    <use href="#cloud" x="1440" y="84"/>
  </g>

  <!-- 远山 -->
  <path d="M0,330 Q120,268 260,318 T520,318 T800,308 L800,360 L0,360 Z" fill="#7cc27a"/>

  <!-- 地面：草皮 + 滚动的泥土纹理 -->
  <rect x="0" y="350" width="800" height="12" fill="#5aa14a"/>
  <rect x="0" y="362" width="800" height="38" fill="#b8895a"/>
  <rect x="0" y="362" width="800" height="38" fill="url(#dirt)"/>

  <!-- 后轮 -->
  <g transform="translate(220 295)">
    <circle r="55" fill="none" stroke="#222" stroke-width="6"/>
    <circle r="50" fill="none" stroke="#999" stroke-width="1.5"/>
    <g id="rw1">
      <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(0)"   stroke="#bbb" stroke-width="1.5"/>
      <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(45)"  stroke="#bbb" stroke-width="1.5"/>
      <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(90)"  stroke="#bbb" stroke-width="1.5"/>
      <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(135)" stroke="#bbb" stroke-width="1.5"/>
    </g>
    <circle r="6" fill="#555"/>
  </g>

  <!-- 车架 -->
  <g stroke="#e74c3c" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="220" y1="295" x2="300" y2="195"/> <!-- 座撑 -->
    <line x1="220" y1="295" x2="350" y2="290"/> <!-- 链撑 -->
    <line x1="350" y1="290" x2="300" y2="195"/> <!-- 座管 -->
    <line x1="300" y1="195" x2="462" y2="200"/> <!-- 上管 -->
    <line x1="350" y1="290" x2="462" y2="236"/> <!-- 下管 -->
    <line x1="462" y1="200" x2="462" y2="236"/> <!-- 头管 -->
    <line x1="462" y1="236" x2="500" y2="295"/> <!-- 前叉 -->
  </g>
  <!-- 座垫、车把 -->
  <path d="M284,190 Q300,182 316,190 L312,199 L288,199 Z" fill="#222"/>
  <line x1="462" y1="200" x2="470" y2="176" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="466" y1="176" x2="490" y2="172" stroke="#222" stroke-width="5" stroke-linecap="round"/>

  <!-- 远侧腿（先画，在身体后面） -->
  <polyline id="leg2" fill="none" stroke="#d9731a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 曲柄（远侧） -->
  <line id="ca2" x1="350" y1="290" x2="350" y2="290" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- 鹈鹕：尾巴 -->
  <path d="M276,168 L236,150 L240,172 L276,182 Z" fill="#c9c9c3" stroke="#8a8a85" stroke-width="1.5"/>

  <!-- 鹈鹕：身体 -->
  <ellipse cx="330" cy="160" rx="62" ry="36" transform="rotate(-18 330 160)"
           fill="#f4f4f0" stroke="#8a8a85" stroke-width="2"/>

  <!-- 鹈鹕：脖子 -->
  <path d="M372,142 Q390,112 402,96 L426,102 Q412,132 400,160 Z"
        fill="#f4f4f0" stroke="#8a8a85" stroke-width="2" stroke-linejoin="round"/>

  <!-- 鹈鹕：头 -->
  <circle cx="430" cy="90" r="20" fill="#f4f4f0" stroke="#8a8a85" stroke-width="2"/>

  <!-- 鹈鹕：喙与喉囊 -->
  <path d="M440,80 L528,96 Q534,101 526,106 L440,104 Z" fill="#f5b041" stroke="#c97a1a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M438,104 Q462,134 478,122 Q470,108 452,104 Z" fill="#f29a3a" stroke="#c97a1a" stroke-width="1"/>
  <line x1="442" y1="92" x2="520" y2="102" stroke="#c97a1a" stroke-width="1" opacity=".6"/>

  <!-- 鹈鹕：眼睛 -->
  <circle cx="438" cy="84" r="3.5" fill="#222"/>
  <circle cx="439.3" cy="82.8" r="1" fill="#fff"/>

  <!-- 鹈鹕：翅膀（绕肩部摆动） -->
  <g id="wing">
    <path d="M360,135 C320,105 260,110 232,128 C270,140 290,160 300,180 C330,170 355,160 360,135 Z"
          fill="#ffffff" stroke="#9a9a94" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- 前轮 -->
  <g transform="translate(500 295)">
    <circle r="55" fill="none" stroke="#222" stroke-width="6"/>
    <circle r="50" fill="none" stroke="#999" stroke-width="1.5"/>
    <g id="rw2">
      <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(0)"   stroke="#bbb" stroke-width="1.5"/>
      <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(45)"  stroke="#bbb" stroke-width="1.5"/>
      <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(90)"  stroke="#bbb" stroke-width="1.5"/>
      <line x1="0" y1="-50" x2="0" y2="50" transform="rotate(135)" stroke="#bbb" stroke-width="1.5"/>
    </g>
    <circle r="6" fill="#555"/>
  </g>

  <!-- 近侧曲柄与链盘 -->
  <circle cx="350" cy="290" r="9" fill="none" stroke="#333" stroke-width="3"/>
  <line id="ca1" x1="350" y1="290" x2="350" y2="290" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- 近侧腿（在最前面） -->
  <polyline id="leg1" fill="none" stroke="#f08c1e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
</svg>

<p>点击画面可暂停 / 继续</p>

<script>
  const $ = id => document.getElementById(id);

  // 几何参数（与 SVG 坐标一致）
  const BB    = { x: 350, y: 290 };   // 中轴（曲柄中心）
  const HIP   = { x: 318, y: 186 };   // 鹈鹕髋部
  const CRANK = 22;                   // 曲柄长度
  const THIGH = 66, SHIN = 62;        // 大腿、小腿长度
  const WHEEL_R = 55;
  const SPEED = 110;                  // 像素 / 秒

  let dist = 0;
  let last = performance.now();
  let paused = false;

  $('scene').addEventListener('click', () => { paused = !paused; });

  // 两段骨骼的逆运动学：返回膝关节坐标（膝朝前）
  function knee(hip, foot, l1, l2) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    const maxD = l1 + l2 - 0.5;
    if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
    const a = Math.atan2(dy, dx);
    const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const ang = Math.acos(Math.min(1, Math.max(-1, cosA)));
    return { x: hip.x + l1 * Math.cos(a - ang), y: hip.y + l1 * Math.sin(a - ang) };
  }

  function drawLeg(el, foot) {
    const k = knee(HIP, foot, THIGH, SHIN);
    el.setAttribute('points',
      `${HIP.x},${HIP.y} ${k.x},${k.y} ${foot.x},${foot.y} ${foot.x + 12},${foot.y}`);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) dist += SPEED * dt;

    // 车轮与曲柄
    const wheelDeg = dist / WHEEL_R * 180 / Math.PI;
    $('rw1').setAttribute('transform', `rotate(${wheelDeg})`);
    $('rw2').setAttribute('transform', `rotate(${wheelDeg})`);

    const th = dist / 24;
    const f1 = { x: BB.x + CRANK * Math.cos(th),  y: BB.y + CRANK * Math.sin(th) };
    const f2 = { x: BB.x - CRANK * Math.cos(th),  y: BB.y - CRANK * Math.sin(th) };

    $('ca1').setAttribute('x2', f1.x); $('ca1').setAttribute('y2', f1.y);
    $('ca2').setAttribute('x2', f2.x); $('ca2').setAttribute('y2', f2.y);

    drawLeg($('leg1'), f1);
    drawLeg($('leg2'), f2);

    // 翅膀轻轻扇动
    $('wing').setAttribute('transform', `rotate(${Math.sin(now / 160) * 8} 355 140)`);

    // 背景滚动：云慢、路快
    const cloudOff = (dist * 0.15) % 800;
    $('clouds').setAttribute('transform', `translate(${-cloudOff} 0)`);
    const roadOff = dist % 60;
    document.querySelector('#dirt').setAttribute('x', -roadOff);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
</script>
</body>
</html>
